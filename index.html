<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <!-- 手機畫面適配 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#172554">

    <title>當沖 Tick 計算器</title>

    <!-- PWA 設定 -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon"
          href="./icons/icon-192.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 480px;
            margin: auto;
        }

        h1 {
            font-size: 24px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px #00000010;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 13px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
        }

        .result {
            font-size: 18px;
            line-height: 2;
        }

        .highlight {
            font-size: 28px;
            font-weight: bold;
            color: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 5px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        th {
            background: #f8fafc;
        }

        .note {
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>當沖 Tick 計算器</h1>

    <div class="card">

        <label>進場價格</label>
        <input type="number"
               id="price"
               value="49.95"
               step="0.01"
               inputmode="decimal">

        <label>交易方向</label>
        <select id="direction">
            <option value="long">先買後賣</option>
            <option value="short">先賣後買</option>
        </select>

        <label>手續費折扣</label>
        <select id="discount">
            <option value="1">無折扣</option>
            <option value="0.5">5 折</option>
            <option value="0.25" selected>2.5 折</option>
            <option value="0.2">2 折</option>
        </select>

        <label>交易股數</label>
        <input type="number"
               id="shares"
               value="1000"
               step="1000"
               min="1"
               inputmode="numeric">

        <button onclick="calculate()">
            計算損益
        </button>

    </div>

    <div class="card">

        <div class="result">
            <div>最低損益兩平出場價</div>
            <div class="highlight" id="breakPrice">--</div>

            <div>
                損益兩平所需：
                <strong id="tickCount">--</strong> Tick
            </div>

            <div>
                預估淨利：
                <strong id="breakProfit">--</strong>
            </div>
        </div>

    </div>

    <div class="card">

        <h3>不同 Tick 的預估獲利</h3>

        <table>
            <thead>
                <tr>
                    <th>Tick</th>
                    <th>出場價</th>
                    <th>淨獲利</th>
                </tr>
            </thead>

            <tbody id="profitTable"></tbody>
        </table>

        <p class="note">
            費用依牌告手續費及設定折扣估算，
            未模擬券商實際逐筆取整及最低手續費。
        </p>

    </div>

</div>

<script>

// ===========================
// 基本費率
// ===========================

const BASE_FEE = 0.001425;
const TAX_RATE = 0.0015;


// ===========================
// Tick 制度
// ===========================

function getTick(price) {

    if (price < 10) return 0.01;
    if (price < 50) return 0.05;
    if (price < 100) return 0.1;
	if (price < 500) return 0.5;
    return 1;

}


// 下一個合法價格
function nextPrice(price) {

    let tick = getTick(price);

    return Number((price + tick).toFixed(2));

}


// 前一個合法價格
function previousPrice(price) {

    let tick;

	if (price > 500) tick = 1;
    else if (price > 100) tick = 0.5;
    else if (price > 50) tick = 0.1;
    else if (price > 10) tick = 0.05;
    else tick = 0.01;

    return Number((price - tick).toFixed(2));

}


// ===========================
// 計算淨獲利
// ===========================

function profit(entry, exit, shares,
                feeRate, direction) {

    let buyPrice, sellPrice;

    if (direction === "long") {
        buyPrice = entry;
        sellPrice = exit;
    } else {
        sellPrice = entry;
        buyPrice = exit;
    }

    const buyAmount = buyPrice * shares;
    const sellAmount = sellPrice * shares;

    const buyFee = buyAmount * feeRate;
    const sellFee = sellAmount * feeRate;

    const tax = sellAmount * TAX_RATE;

    return (
        sellAmount - buyAmount
        - buyFee
        - sellFee
        - tax
    );

}


// ===========================
// 主要計算
// ===========================

function calculate() {

    const entry = Number(
        document.getElementById("price").value
    );

    const direction =
        document.getElementById("direction").value;

    const discount = Number(
        document.getElementById("discount").value
    );

    const shares = Number(
        document.getElementById("shares").value
    );

    if (
        !Number.isFinite(entry) || entry <= 0 || !Number.isInteger(shares) || shares <= 0
    ) {
        alert("請輸入有效的價格及股數");
        return;
    }

    const feeRate = BASE_FEE * discount;

    let exit = entry;
    let count = 0;

    // 找到第一個不虧損的合法價格
    while (count < 10000) {

        exit = direction === "long"
            ? nextPrice(exit)
            : previousPrice(exit);

        if (exit <= 0) break;

        count++;

        let net = profit(
            entry, exit, shares,
            feeRate, direction
        );

        if (net >= 0) break;

    }

    const breakProfit = profit(
        entry, exit, shares,
        feeRate, direction
    );

    document.getElementById("breakPrice")
        .textContent = exit.toFixed(2);

    document.getElementById("tickCount")
        .textContent = count;

    document.getElementById("breakProfit")
        .textContent =
        breakProfit.toFixed(2) + " 元";


    // =======================
    // 列出 1～5 Tick 獲利
    // =======================

    let current = entry;
    let html = "";

    for (let i = 1; i <= 5; i++) {

        current = direction === "long"
            ? nextPrice(current)
            : previousPrice(current);

        let net = profit(
            entry, current, shares,
            feeRate, direction
        );

        html += `
            <tr>
                <td>${i}</td>
                <td>${current.toFixed(2)}</td>
                <td>${net.toFixed(2)}</td>
            </tr>
        `;

    }

    document.getElementById("profitTable")
        .innerHTML = html;

}


// 初次載入自動計算
calculate();


// ===========================
// 註冊 Service Worker
// ===========================

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./sw.js")
            .catch(error => {
                console.log("SW error:", error);
            });

    });

}

</script>

</body>
</html>
